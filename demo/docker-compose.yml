# From demo/:  docker compose up --build   then paste an OpenAI key at http://localhost:8787
# Optional presets in demo/.env: OPENAI_API_KEY skips the key screen, LETHE_OPENAI_STORE=0/1 sets verification mode.
services:
  lethe:
    build: .
    image: lethe-demo
    ports:
      - "127.0.0.1:8787:8787"   # localhost only: the server spends your key and has no login
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LETHE_OPENAI_STORE: ${LETHE_OPENAI_STORE:-}
    restart: "no"
